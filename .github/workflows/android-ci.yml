name: Android CI
on:
  push:
    branches: [ main, "mobilevsr-**" ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build and test
        run: gradle assembleDebug test
      - uses: actions/upload-artifact@v4
        with:
          name: lipsync-v0.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5
